  # test_datasets: ["1029_S11_ECH7-1","115_S11_List-2"] #test set used in training  ["1029_S22_ECH7-1","115_S22_List-2"]

  train_datasets: [    "1112_ECH-S22","1112_ECK12-S22","1112_ECB-S22"] # "115_S11_List-1"   "115_S11_List-2"  "1029_S11_ECH7-1"   "1029_S11_ECH7-2"   "1112_ECH-S11" "1112_ECB-S11" "1112_ECK12-S11"
